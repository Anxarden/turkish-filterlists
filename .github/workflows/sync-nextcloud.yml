ChatGPT said:

Yes! You can set up GitHub to fetch your .txt files from Nextcloud automatically using GitHub Actions or a scheduled script on your machine. Here’s how you can do it:
Method 1: Using GitHub Actions (Fully Automated)

GitHub Actions can fetch files from Nextcloud using curl and commit them to your repository.
Steps to Set Up:

    Ensure Your Nextcloud Files Are Publicly Accessible
        In Nextcloud, generate public share links for your .txt files.
        Modify the URLs to end with /download to get the raw file.
        Example:

    https://your-nextcloud.com/s/abc123/download

Create a GitHub Action Workflow

    In your GitHub repository, go to:
    Settings > Actions > New workflow
    Create a new file:
    .github/workflows/sync_nextcloud.yml

Paste and Save the Following Workflow:

    name: Sync Nextcloud Files

    on:
      schedule:
        - cron: '0 * * * *' # Runs every hour
      workflow_dispatch: # Allows manual run

    jobs:
      fetch-files:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v3

          - name: Download Files from Nextcloud
            run: |
              curl -o file1.txt "https://your-nextcloud.com/s/abc123/download"
              curl -o file2.txt "https://your-nextcloud.com/s/def456/download"
              curl -o file3.txt "https://your-nextcloud.com/s/ghi789/download"
              curl -o file4.txt "https://your-nextcloud.com/s/jkl012/download"

          - name: Commit and Push Changes
            run: |
              git config --global user.name "github-actions"
              git config --global user.email "actions@github.com"
              git add .
              git commit -m "Auto-fetch from Nextcloud" || echo "No changes to commit"
              git push

How It Works:

    The workflow runs every hour (you can change the schedule).
    It downloads the .txt files from Nextcloud.
    If changes are detected, it commits and pushes them to GitHub.

Method 2: Using a Local Script (If You Have a PC or Server)

If you have a computer that runs regularly, you can use a simple batch script to sync files.
Steps:

    Install Git on your system.
    Save this .bat script and schedule it in Task Scheduler:

    cd C:\path\to\your\repo
    curl -o file1.txt "https://your-nextcloud.com/s/abc123/download"
    curl -o file2.txt "https://your-nextcloud.com/s/def456/download"
    curl -o file3.txt "https://your-nextcloud.com/s/ghi789/download"
    curl -o file4.txt "https://your-nextcloud.com/s/jkl012/download"
    git add .
    git commit -m "Auto-sync from Nextcloud"
    git push origin main

    Schedule the script using Windows Task Scheduler to run at set intervals.

