name: Sync Nextcloud Files

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allows manual execution

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Files from Nextcloud
        run: |
          curl -o file1.txt "https://your-nextcloud.com/s/abc123/download"
          curl -o file2.txt "https://your-nextcloud.com/s/def456/download"
          curl -o file3.txt "https://your-nextcloud.com/s/ghi789/download"
          curl -o file4.txt "https://your-nextcloud.com/s/jkl012/download"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-fetch from Nextcloud" || echo "No changes to commit"
          git push
