name: Auto-fetch from Nextcloud

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:  # Allows manual execution

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: filters
          token: ${{ secrets.GH_PAT }}

      - name: Download Filter Files from Nextcloud
        run: |
          # Fetch all four files
          curl -fSL -o filterlist.txt "${{ secrets.LINK_FILTERLIST }}"
          curl -fSL -o filters/ads.txt "${{ secrets.LINK_ADS }}"
          curl -fSL -o filters/badware.txt "${{ secrets.LINK_BADWARE }}"
          curl -fSL -o filters/gambling.txt "${{ secrets.LINK_GAMBLING }}"

      - name: Update Last Modified Date in filterlist.txt
        run: |
          TODAY=$(date +'%Y.%m.%d')
          sed -i "s/^! Last modified:.*/! Last modified: $TODAY/" filterlist.txt

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Anxarden"
          git config --global user.email "Anxarden@users.noreply.github.com"
          git add filterlist.txt filters/*.txt
          git commit -m "Auto-fetch from Nextcloud" || exit 0
          git push https://x-access-token:${GH_TOKEN}@github.com/Anxarden/turkish-filterlists.git filters
