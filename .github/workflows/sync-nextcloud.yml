name: Auto-fetch from Nextcloud

on:
  schedule:
  - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:  # Allows manual execution

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: filters  # Checkout the correct branch
          token: ${{ secrets.GH_PAT }}  # Use the PAT for authentication


      - name: Download Files from Nextcloud
        run: |
          curl -o filterlist.txt "${{ secrets.LINK_FILTERLIST }}"
          curl -o filters/ads.txt "${{ secrets.LINK_ADS }}"
          curl -o filters/badware.txt "${{ secrets.LINK_BADWARE }}"
          curl -o filters/gambling.txt "${{ secrets.LINK_GAMBLING }}"


      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # Use the PAT
        run: |
          git config --global user.name "Anxarden"
          git config --global user.email "Anxarden@users.noreply.github.com"
          git add .
          git commit -m "Auto-fetch from Nextcloud" || exit 0
          git push https://x-access-token:${GH_TOKEN}@github.com/Anxarden/turkish-filterlists.git filters
