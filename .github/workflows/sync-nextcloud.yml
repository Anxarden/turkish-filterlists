name: Auto-Fetch and Update Filterlists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: filters
          token: ${{ secrets.GH_PAT }}

      - name: Download Files from Nextcloud
        run: |
          mkdir -p filters
          curl -fSL -o filterlist.txt "${{ secrets.LINK_FILTERLIST }}"
          curl -fSL -o filters/cosmetic.txt "${{ secrets.LINK_COSMETIC }}"
          curl -fSL -o filters/static.txt "${{ secrets.LINK_STATIC }}"
          curl -fSL -o filters/gambling.txt "${{ secrets.LINK_GAMBLING }}"
          curl -fSL -o filters/adult.txt "${{ secrets.LINK_ADULT }}"

      - name: Update Last Modified Date in Filterlist
        run: |
          TODAY=$(date +'%Y.%m.%d')
          sed -i "s/^! Last modified:.*/! Last modified: $TODAY/" filterlist.txt
          sed -i "s/^! Last modified:.*/! Last modified: $TODAY/" filterlist-gambling.txt
          
      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Anxarden"
          git config --global user.email "Anxarden@users.noreply.github.com"
          git add .
          git commit -m "Auto-fetch and update filterlists." || exit 0
          git push https://x-access-token:${GH_TOKEN}@github.com/Anxarden/turkish-filterlists.git filters
